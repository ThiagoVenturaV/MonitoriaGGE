version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: hostinger_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    restart: always
    depends_on:
      - api

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: hostinger_api
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:?set ALLOWED_ORIGINS}
      - BOOTSTRAP_STAFF_JSON=${BOOTSTRAP_STAFF_JSON:-}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
      - R2_BUCKET_NAME=${R2_BUCKET_NAME}
      - R2_ENDPOINT=${R2_ENDPOINT}
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: hostinger_redis
    restart: always
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  worker1:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: hostinger_worker_1
    command: npm run start:worker
    restart: always
    environment:
      - NODE_ENV=production
      - WORKER_ID=1
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
    depends_on:
      - redis
      - api

  worker2:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: hostinger_worker_2
    command: npm run start:worker
    restart: always
    environment:
      - NODE_ENV=production
      - WORKER_ID=2
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
    depends_on:
      - redis
      - api

volumes:
  redis_data:
